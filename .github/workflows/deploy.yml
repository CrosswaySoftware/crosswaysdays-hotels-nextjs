name: Deploy Crossways Days Hotels

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # 1️⃣ Checkout Repository
      - name: Checkout code
        uses: actions/checkout@v5

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t 365627072396.dkr.ecr.ap-south-1.amazonaws.com/crosswaysdays-hotels-nextjs:latest .

      # 5️⃣ Push Docker Image
      - name: Push Docker Image
        run: |
          docker push 365627072396.dkr.ecr.ap-south-1.amazonaws.com/crosswaysdays-hotels-nextjs:latest

      # 6️⃣ Deploy on EC2 via SSM
      - name: Deploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-08636f55d230dd954" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Crossways Days Hotels" \
            --query "Command.CommandId" \
            --output text \
            --parameters commands='[
              "set -ex",

              "cd /home/ubuntu/hotel-projects",

              "echo 🔑 Login to ECR",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 365627072396.dkr.ecr.ap-south-1.amazonaws.com",

              "echo 🚀 Pull latest image",
              "docker compose pull crosswaysdays-hotels-nextjs",

              "echo 🔁 Restart container",
              "docker compose up -d --no-deps crosswaysdays-hotels-nextjs",

              "echo 🧹 Cleaning unused Docker images",
              "docker image prune -a -f",

              "echo ✅ Deployment completed"
            ]')

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id i-08636f55d230dd954

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-08636f55d230dd954 \
            --output text
